name: Keep Streamlit Awake

on:
  schedule:
    - cron: "0 * * * *" # Esegue lo script ogni ora
  workflow_dispatch: # Permette di avviarlo anche a mano se serve

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # <-- NUOVO: Permesso per bypassare il blocco
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Aggiorna il file di ping
        run: |
          echo "Ultimo risveglio: $(date)" > keepalive.txt
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add keepalive.txt
          git commit -m "Auto-ping per tenere sveglia l'app Streamlit" || exit 0
          git push

      - name: Prevenzione blocco 60 giorni
        uses: gautamkrishnar/keepalive-workflow@v2 # <-- NUOVO: Modulo anti-sospensione
